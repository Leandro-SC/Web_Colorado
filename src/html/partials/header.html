<header class="site-header" data-header>
  <div class="site-header__bar">
    <a class="brand" href="index.html" data-i18n-aria="aria.go_home">
      <span class="brand__logo">
        <picture>
          <source srcset="img/logo.avif" type="image/avif">
          <source srcset="img/logo.webp" type="image/webp">
          <img
            src="img/logo.jpg"
            width="180"
            height="60"
            alt="Colorado Pro Masonry LLC logo"
            loading="eager"
            decoding="async"
          />
        </picture>
      </span>
      <span class="brand__name" data-i18n="brand.name">Colorado Pro Masonry LLC</span>
    </a>

    <nav class="nav-desktop" aria-label="Primary">
      <ul class="nav-desktop__list">
        <li><a class="nav-desktop__link" href="index.html" data-nav="home" data-i18n="nav.home">Home</a></li>
        <li><a class="nav-desktop__link" href="services.html" data-nav="services" data-i18n="nav.services">Services</a></li>
        <li><a class="nav-desktop__link" href="projects.html" data-nav="projects" data-i18n="nav.projects">Projects</a></li>
        <li><a class="nav-desktop__link" href="about.html" data-nav="about" data-i18n="nav.about">About</a></li>
        <li><a class="nav-desktop__link" href="contact.html" data-nav="contact" data-i18n="nav.contact">Contact</a></li>
      </ul>
    </nav>

    <div class="site-header__actions">
      <a class="btn btn--primary btn--sm" href="contact.html" data-i18n="header.quote">Get a Quote</a>

      <button
        class="hamburger"
        type="button"
        data-nav-toggle
        data-i18n-aria="aria.open_menu"
        aria-controls="mobileNav"
        aria-expanded="false"
        title="Open menu"
      >
        <span class="hamburger__box" aria-hidden="true">
          <span class="hamburger__line"></span>
        </span>
      </button>
    </div>
  </div>

  <div class="nav-overlay" data-nav-overlay hidden></div>

  <nav class="mobile-nav" id="mobileNav" data-mobile-nav hidden aria-label="Primary">
    <div class="mobile-nav__panel">
      <div class="mobile-nav__handle" aria-hidden="true"></div>

      <div class="mobile-nav__top">
        <div class="mobile-nav__brand">
          <span class="mobile-nav__brandLogo" aria-hidden="true"></span>
          <div class="mobile-nav__brandText">
            <span class="mobile-nav__brandName" data-i18n="brand.short">Colorado Pro Masonry</span>
            <span class="mobile-nav__brandMeta" data-i18n="header.mobile.meta">Fast quotes • Clean installs</span>
          </div>
        </div>

        <button class="icon-btn icon-btn--close" type="button" data-nav-close data-i18n-aria="aria.close_menu">
          <span class="icon-btn__x" aria-hidden="true"></span>
        </button>
      </div>

      <ul class="mobile-nav__list">
        <li><a class="mobile-nav__link" href="index.html" data-nav="home" data-i18n="nav.home">Home</a></li>
        <li><a class="mobile-nav__link" href="services.html" data-nav="services" data-i18n="nav.services">Services</a></li>
        <li><a class="mobile-nav__link" href="projects.html" data-nav="projects" data-i18n="nav.projects">Projects</a></li>
        <li><a class="mobile-nav__link" href="about.html" data-nav="about" data-i18n="nav.about">About</a></li>
        <li><a class="mobile-nav__link" href="contact.html" data-nav="contact" data-i18n="nav.contact">Contact</a></li>
      </ul>

      <div class="mobile-nav__cta">
        <a class="btn btn--primary" href="contact.html" data-i18n="header.mobile.book">Book an Appointment</a>

        <div class="mobile-nav__ctaRow">
          <a class="btn btn--ghost mobile-nav__ctaBtn" href="tel:+15018120003" data-i18n="header.mobile.call">Call now</a>
          <a class="btn btn--ghost mobile-nav__ctaBtn" href="projects.html" data-i18n="header.mobile.work">View work</a>
        </div>

        <p class="mobile-nav__note" data-i18n="header.mobile.note">
          Licensed craftsmanship built for long-term durability.
        </p>
      </div>
    </div>
  </nav>
</header>
