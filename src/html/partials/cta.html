<section class="cta-banner" aria-label="Book an appointment">
  <picture class="cta-banner__bg" aria-hidden="true">
    <source srcset="img/colorado_mansory_40.avif" type="image/avif">
    <source srcset="img/colorado_mansory_40.webp" type="image/webp">
    <img
      src="img/colorado_mansory_40.jpg"
      alt=""
      width="1600"
      height="900"
      loading="lazy"
      decoding="async"
    />
  </picture>

  <div class="cta-banner__shade" aria-hidden="true"></div>

  <div class="cta-banner__inner" data-reveal>
    <div class="cta-banner__panel">
      <h2 class="cta-banner__title" data-i18n="cta.banner.title">Ready to get started?</h2>
      <p class="cta-banner__subtitle" data-i18n="cta.banner.text">Book an appointment today.</p>

      <div class="cta-banner__actions" role="group" aria-label="Primary actions">
        <a class="cta-banner__btn cta-banner__btn--phone" href="tel:+13033048169" aria-label="Call (303) 304 8169">
          (303) 304 8169
        </a>

        <a class="cta-banner__btn cta-banner__btn--appt" href="contact.html" aria-label="Book an appointment" data-i18n="cta.banner.button">
          Book an Appointment
        </a>
      </div>
    </div>
  </div>

  <!-- Wave inferior estilizada -->
  <div class="cta-banner__wave" aria-hidden="true">
    <svg viewBox="0 0 1440 180" preserveAspectRatio="none" focusable="false" aria-hidden="true">
      <path d="M0,96 C160,140 320,164 480,142 C640,120 760,70 920,64 C1080,58 1200,98 1440,120 L1440,180 L0,180 Z"></path>
    </svg>
  </div>
</section>
